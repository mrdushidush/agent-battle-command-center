version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps-actions)"

  # Python dependencies (packages/agents)
  - package-ecosystem: "pip"
    directory: "/packages/agents"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps-agents)"

  # Root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # No per-package npm entries. This is a pnpm workspace: every package
  # resolves through the single root pnpm-lock.yaml. A Dependabot entry
  # scoped to /packages/<name> edits only that package.json and never the
  # root lockfile, so every PR it opened failed CI on
  # ERR_PNPM_OUTDATED_LOCKFILE (see #234, #239, #242, #247). The root "/"
  # entry above already walks the whole workspace - its PRs update several
  # packages/*/package.json plus the lockfile in one commit (see #241, #249).
