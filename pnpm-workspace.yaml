packages:
  - 'packages/*'

overrides:
  esbuild: '>=0.28.1'
  minimatch: '>=10.2.3'
  handlebars: '>=4.7.9'
  lodash: '^4.18.0'
  path-to-regexp: '^0.1.13'
  undici: '^7.29.0'
  brace-expansion: '^5.0.9'
  postcss: '^8.5.23'
  qs: '^6.15.2'
  shell-quote: '^1.9.0'
  # Major-scoped selectors. These three packages have live majors whose APIs
  # are mutually incompatible (js-yaml 3 safeLoad vs 4+ load; body-parser 1
  # for express 4 vs 2 for express 5; babel 7 vs 8). A bare caret would pin
  # any future consumer of the newer major down onto the old one, so each
  # override is scoped to the major that is actually in the tree today.
  js-yaml@3: '^3.15.0'
  body-parser@1: '^1.20.6'
  '@babel/core@7': '^7.29.6'
  # socket.io transitives. socket.io 4.8.3 is already the latest release, so
  # no direct-dependency bump reaches these - they can only be forced here.
  # GHSA-2m8v-j782-fhvr / GHSA-r635-g3xr-vw7x / GHSA-96hv-2xvq-fx4p
  socket.io-parser: '^4.2.7'
  engine.io: '^6.6.7'
  # Pinned exactly, not '^8.21.0'. A caret resolves to 8.21.2, published
  # 2026-08-03, which pnpm 11's 24h minimumReleaseAge policy rejects on every
  # subsequent command - including in CI. 8.21.1 is past the cooldown and is
  # still >= 8.21.0, the patched floor. Safe to float once 8.21.2 ages out.
  ws: '8.21.1'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
